<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresá tu código — Tus Clips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green-dark:#0F3D24; --green-darker:#0A2A19; --green-light:#4CAF6D; --green-pale:#E4F3E9;
  --white:#FFFFFF; --gray-dark:#1A1D1B; --gray-mid:#63696A; --gray-line:#E4E7E4;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif;color:var(--gray-dark);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(76,175,109,.18), transparent 55%),
    var(--white);
}
h1,.brand{font-family:'Space Grotesk',sans-serif;}
a{text-decoration:none;color:inherit;}
.box{max-width:420px;width:100%;text-align:center;}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:19px;color:var(--green-dark);margin-bottom:38px;}
.brand svg{width:26px;height:26px;}
h1{font-size:26px;font-weight:600;margin-bottom:10px;letter-spacing:-.01em;}
p.lead{color:var(--gray-mid);font-size:14.5px;line-height:1.55;margin-bottom:32px;}
.code-input{
  width:100%;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--green-dark);
  border:2px solid var(--gray-line);border-radius:14px;padding:16px;margin-bottom:16px;
  transition:border-color .2s;
}
.code-input:focus{outline:none;border-color:var(--green-light);}
.code-input::placeholder{color:#c9cfca;letter-spacing:.04em;font-weight:500;}
.submit-btn{
  width:100%;background:var(--green-dark);color:#fff;border:none;padding:15px;border-radius:14px;
  font-weight:600;font-size:15px;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit-btn:hover{background:var(--green-darker);transform:translateY(-2px);}
.submit-btn:disabled{opacity:.6;cursor:default;transform:none;}
.err{display:none;background:#FCEBEA;color:#c2453c;font-size:13.5px;font-weight:500;padding:11px 14px;border-radius:11px;margin-top:14px;text-align:left;}
.help{margin-top:30px;font-size:13px;color:var(--gray-mid);line-height:1.6;}
.help a{color:var(--green-dark);font-weight:600;cursor:pointer;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--gray-mid);margin-top:26px;}
.back-link:hover{color:var(--green-dark);}
</style>
</head>
<body>

<div class="box">
  <a href="index.html" class="brand">
    <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="2.4"/><path d="M15 13L15 27L27 20Z" fill="currentColor"/></svg>
    tus<span style="color:#4CAF6D">clips</span>
  </a>
  <h1>Ingresá tu código</h1>
  <p class="lead">Te lo entrega el complejo cuando confirmás que querés el video de tu partido.</p>

  <input type="text" class="code-input" id="codeInput" placeholder="EJ. K3-4821" maxlength="12">
  <button class="submit-btn" id="submitBtn">
    Ver mi partido
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  <div class="err" id="errBox"></div>

  <p class="help">¿No tenés código todavía? Pedíselo al encargado de la cancha donde jugaste.</p>
  <a href="index.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    Volver al inicio
  </a>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(
    'https://jwzsjprwscinxonpdbfw.supabase.co',
    'sb_publishable_n5Tm7gI91-exEStWoVZftg_TeSegW43'
  );

  const input = document.getElementById('codeInput');
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errBox');

  async function buscar(){
    const codigo = input.value.trim();
    err.style.display = 'none';
    if(!codigo){
      err.textContent = 'Ingresá el código que te dieron en la cancha.';
      err.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Buscando…';

    const { data, error } = await supabase.rpc('buscar_partido_por_codigo', { codigo });

    btn.disabled = false;
    btn.innerHTML = 'Ver mi partido <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

    if(error || !data || data.length === 0){
      err.textContent = 'No encontramos ningún partido con ese código. Revisalo o consultá con la cancha.';
      err.style.display = 'block';
      return;
    }

    window.location.href = 'editor.html?codigo=' + encodeURIComponent(codigo);
  }

  btn.addEventListener('click', buscar);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') buscar(); });
  input.addEventListener('input', () => { input.value = input.value.toUpperCase(); });
</script>
</body>
</html>
