<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar partido — Tus Clips</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green-dark:#0F3D24; --green-darker:#0A2A19; --green-light:#4CAF6D; --green-pale:#E4F3E9;
  --white:#FFFFFF; --gray-dark:#1A1D1B; --gray-mid:#63696A; --gray-line:#E4E7E4;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100%;}
body{
  font-family:'Inter',sans-serif;color:var(--gray-dark);
  min-height:100vh;padding:24px;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(76,175,109,.18), transparent 55%),
    var(--white);
}
h1,.brand{font-family:'Space Grotesk',sans-serif;}
a{text-decoration:none;color:inherit;}
.wrap{max-width:560px;margin:0 auto;}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:19px;color:var(--green-dark);margin:10px 0 34px;}
.brand svg{width:26px;height:26px;}
.box{text-align:center;margin-bottom:22px;}
h1{font-size:26px;font-weight:600;margin-bottom:10px;letter-spacing:-.01em;}
p.lead{color:var(--gray-mid);font-size:14.5px;line-height:1.55;}

.card{
  background:var(--white);border:1.5px solid var(--gray-line);border-radius:18px;
  padding:22px;box-shadow:0 10px 30px rgba(15,61,36,.06);
}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--gray-mid);margin-bottom:6px;}
select, input[type="date"], input[type="time"]{
  width:100%;padding:13px 14px;border:1.5px solid var(--gray-line);border-radius:11px;
  font-family:'Inter',sans-serif;font-size:15px;color:var(--gray-dark);background:var(--white);
  transition:border-color .2s;
}
select:disabled{color:#b7bcb8;background:#f7f8f7;cursor:not-allowed;}
select:focus, input:focus{outline:none;border-color:var(--green-light);}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.submit-btn{
  width:100%;background:var(--green-dark);color:#fff;border:none;padding:15px;border-radius:14px;
  font-weight:600;font-size:15px;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:6px;
}
.submit-btn:hover{background:var(--green-darker);transform:translateY(-2px);}
.submit-btn:disabled{opacity:.6;cursor:default;transform:none;}

.err{display:none;background:#FCEBEA;color:#c2453c;font-size:13.5px;font-weight:500;padding:11px 14px;border-radius:11px;margin-top:14px;text-align:left;}

.results{margin-top:18px;display:none;}
.result-card{
  background:var(--white);border:1.5px solid var(--gray-line);border-radius:14px;padding:16px;
  margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;
  transition:.2s;
}
.result-card:hover{border-color:var(--green-light);transform:translateY(-1px);}
.result-info .r-top{font-weight:600;font-size:15px;color:var(--gray-dark);}
.result-info .r-sub{font-size:13px;color:var(--gray-mid);margin-top:3px;}
.result-go{
  flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--green-pale);
  display:flex;align-items:center;justify-content:center;color:var(--green-dark);
}

.help{margin-top:26px;text-align:center;font-size:13px;color:var(--gray-mid);line-height:1.6;}
.help a{color:var(--green-dark);font-weight:600;cursor:pointer;}
.back-link{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--gray-mid);margin-top:20px;}
.back-link:hover{color:var(--green-dark);}
</style>
</head>
<body>

<div class="wrap">
  <a href="index.html" class="brand">
    <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="2.4"/><path d="M15 13L15 27L27 20Z" fill="currentColor"/></svg>
    tus<span style="color:#4CAF6D">clips</span>
  </a>

  <div class="box">
    <h1>Buscá tu partido</h1>
    <p class="lead">Elegí el complejo y la cancha donde jugaste, y la fecha y hora del partido.</p>
  </div>

  <div class="card">
    <div class="field">
      <label>Complejo</label>
      <select id="selComplejo">
        <option value="">Cargando complejos…</option>
      </select>
    </div>
    <div class="field">
      <label>Cancha</label>
      <select id="selCancha" disabled>
        <option value="">Elegí primero el complejo</option>
      </select>
    </div>
    <div class="row-2">
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="inpFecha">
      </div>
      <div class="field">
        <label>Hora</label>
        <div class="row-2" style="gap:8px;">
          <select id="selHora">
            <option value="">Hora</option>
          </select>
          <select id="selMin">
            <option value="00">:00</option>
            <option value="15">:15</option>
            <option value="30">:30</option>
            <option value="45">:45</option>
          </select>
        </div>
      </div>
    </div>

    <button class="submit-btn" id="btnBuscar">
      Ver video
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <div class="err" id="errBox"></div>
  </div>

  <div class="results" id="results"></div>

  <p class="help">¿Tenés el código que te dio la cancha? <a href="acceso.html">Ingresalo acá</a></p>
  <a href="index.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    Volver al inicio
  </a>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(
    'https://jwzsjprwscinxonpdbfw.supabase.co',
    'sb_publishable_n5Tm7gI91-exEStWoVZftg_TeSegW43'
  );

  const selComplejo = document.getElementById('selComplejo');
  const selCancha = document.getElementById('selCancha');
  const inpFecha = document.getElementById('inpFecha');
  const selHora = document.getElementById('selHora');
  const selMin = document.getElementById('selMin');
  for(let h = 0; h < 24; h++){
    const hh = String(h).padStart(2,'0');
    selHora.insertAdjacentHTML('beforeend', `<option value="${hh}">${hh} hs</option>`);
  }
  const btn = document.getElementById('btnBuscar');
  const err = document.getElementById('errBox');
  const results = document.getElementById('results');

  function mostrarError(msg){
    err.textContent = msg;
    err.style.display = 'block';
  }
  function ocultarError(){ err.style.display = 'none'; }

  async function cargarComplejos(){
    const { data, error } = await supabase.rpc('listar_complejos');
    if(error || !data || data.length === 0){
      selComplejo.innerHTML = '<option value="">No hay complejos cargados</option>';
      return;
    }
    selComplejo.innerHTML = '<option value="">Elegí un complejo</option>' +
      data.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
  }

  selComplejo.addEventListener('change', async () => {
    results.style.display = 'none';
    ocultarError();
    const id = selComplejo.value;
    if(!id){
      selCancha.disabled = true;
      selCancha.innerHTML = '<option value="">Elegí primero el complejo</option>';
      return;
    }
    selCancha.disabled = true;
    selCancha.innerHTML = '<option value="">Cargando canchas…</option>';
    const { data, error } = await supabase.rpc('listar_canchas_de_complejo', { p_complejo_id: id });
    if(error || !data || data.length === 0){
      selCancha.innerHTML = '<option value="">No hay canchas en este complejo</option>';
      return;
    }
    selCancha.innerHTML = '<option value="">Todas las canchas</option>' +
      data.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    selCancha.disabled = false;
  });

  function fmtHora(h){ return h ? h.slice(0,5) : ''; }
  function fmtFecha(f){
    if(!f) return '';
    const [y,m,d] = f.split('-');
    return `${d}/${m}/${y}`;
  }

  async function buscar(){
    ocultarError();
    results.style.display = 'none';
    results.innerHTML = '';

    const complejoId = selComplejo.value;
    if(!complejoId){
      mostrarError('Elegí un complejo para buscar.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Buscando…';

    const { data, error } = await supabase.rpc('buscar_partidos', {
      p_complejo_id: complejoId,
      p_cancha_id: selCancha.value || null,
      p_fecha: inpFecha.value || null,
      p_hora: selHora.value ? (selHora.value + ':' + selMin.value) : null,
    });

    btn.disabled = false;
    btn.innerHTML = 'Ver video <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

    if(error){
      mostrarError('Hubo un problema buscando el partido. Probá de nuevo.');
      return;
    }
    if(!data || data.length === 0){
      mostrarError('No encontramos ningún video con esos datos. Probá ajustando la fecha u hora.');
      return;
    }
    if(data.length === 1){
      window.location.href = 'editor.html?id=' + encodeURIComponent(data[0].id);
      return;
    }

    results.innerHTML = data.map(p => `
      <div class="result-card" onclick="window.location.href='editor.html?id=${p.id}'">
        <div class="result-info">
          <div class="r-top">${p.complejo_nombre} · ${p.cancha_nombre}</div>
          <div class="r-sub">${fmtFecha(p.fecha)} · ${fmtHora(p.hora_inicio)} hs${p.equipo_a && p.equipo_b ? ' · ' + p.equipo_a + ' vs ' + p.equipo_b : ''}</div>
        </div>
        <div class="result-go">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </div>
    `).join('');
    results.style.display = 'block';
  }

  btn.addEventListener('click', buscar);

  cargarComplejos();
</script>
</body>
</html>
