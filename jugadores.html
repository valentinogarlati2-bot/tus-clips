<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking de jugadores — Tus Clips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green-dark:#0F3D24; --green-darker:#0A2A19; --green-light:#4CAF6D; --green-pale:#E4F3E9;
  --white:#FFFFFF; --gray-dark:#1A1D1B; --gray-mid:#63696A; --gray-line:#E4E7E4; --gray-soft:#F4F6F4;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--gray-soft);color:var(--gray-dark);-webkit-font-smoothing:antialiased;}
h1,h2,.brand{font-family:'Space Grotesk',sans-serif;}
a{text-decoration:none;color:inherit;}
.wrap{max-width:840px;margin:0 auto;padding:0 20px;}

nav{background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-line);padding:14px 0;}
.nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:840px;margin:0 auto;padding:0 20px;}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:18px;color:var(--green-dark);}
.brand svg{width:24px;height:24px;}
.back-link{font-size:13.5px;font-weight:600;color:var(--gray-mid);}
.back-link:hover{color:var(--green-dark);}

header{padding:44px 0 8px;text-align:center;}
header .eyebrow{font-size:12.5px;font-weight:700;color:var(--green-dark);text-transform:uppercase;letter-spacing:.04em;}
header h1{font-size:clamp(24px,4vw,32px);font-weight:600;margin-top:8px;}
header p{color:var(--gray-mid);font-size:14.5px;margin-top:8px;}

.tabs{display:flex;gap:8px;justify-content:center;margin:26px 0 22px;}
.tab-btn{padding:10px 20px;border-radius:100px;border:1.5px solid var(--gray-line);font-weight:600;font-size:13.5px;color:var(--gray-mid);background:#fff;transition:.2s;}
.tab-btn.active{background:var(--green-dark);border-color:var(--green-dark);color:#fff;}

.board{background:#fff;border:1px solid var(--gray-line);border-radius:20px;padding:8px;margin-bottom:60px;}
.board-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--gray-line);}
.board-row:last-child{border-bottom:none;}
.rank-num{width:30px;height:30px;border-radius:50%;background:var(--gray-soft);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--gray-mid);flex-shrink:0;}
.board-row:nth-child(1) .rank-num{background:#FFE9B0;color:#8a6a00;}
.board-row:nth-child(2) .rank-num{background:#E4E7E4;color:#4a4f4c;}
.board-row:nth-child(3) .rank-num{background:#F3D9C4;color:#8a4a1f;}
.player-name{flex:1;font-weight:600;font-size:14.5px;}
.player-value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--green-dark);white-space:nowrap;}
.player-value span{font-size:11px;color:var(--gray-mid);font-weight:500;margin-left:4px;}
.empty{text-align:center;color:var(--gray-mid);font-size:13.5px;padding:40px 20px;}

/* TABLA DE POSICIONES */
.table-wrap{background:#fff;border:1px solid var(--gray-line);border-radius:20px;overflow-x:auto;margin-bottom:60px;}
table{width:100%;border-collapse:collapse;min-width:560px;}
th,td{padding:12px 10px;text-align:center;font-size:12.5px;border-bottom:1px solid var(--gray-line);}
th{background:var(--gray-soft);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.02em;color:var(--gray-mid);}
tr:last-child td{border-bottom:none;}
td:first-child, th:first-child{text-align:center;width:30px;}
td:nth-child(2), th:nth-child(2){text-align:left;font-weight:600;font-size:13.5px;color:var(--gray-dark);}
.pts{font-weight:700;color:var(--green-dark);}
.form-badges{display:flex;gap:3px;justify-content:center;}
.fb{width:20px;height:20px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;}
.fb.v{background:var(--green-light);color:#0A2A19;}
.fb.d{background:#e0453c;}
.fb.e{background:#c9cfca;color:#4a4f4c;}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="2.4"/><path d="M15 13L15 27L27 20Z" fill="currentColor"/></svg>
      tus<span style="color:#4CAF6D">clips</span>
    </a>
    <a href="index.html" class="back-link">← Volver al inicio</a>
  </div>
</nav>

<div class="wrap">
  <header>
    <div class="eyebrow">Ranking</div>
    <h1>Los mejores de la cancha</h1>
    <p>Estadísticas armadas con los jugadores y goles cargados desde el editor de cada partido.</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabGoleadores">⚽ Goleadores</button>
    <button class="tab-btn" id="tabTabla">📊 Tabla</button>
  </div>

  <div class="board" id="board">
    <div class="empty">Cargando...</div>
  </div>
  <div class="table-wrap" id="tableWrap" style="display:none;"></div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient('https://jwzsjprwscinxonpdbfw.supabase.co', 'sb_publishable_n5Tm7gI91-exEStWoVZftg_TeSegW43');

  const board = document.getElementById('board');
  const tableWrap = document.getElementById('tableWrap');
  const tabGoleadores = document.getElementById('tabGoleadores');
  const tabTabla = document.getElementById('tabTabla');

  function medalla(i){ return i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1); }

  function renderBoard(rows, valueKey, valueLabel){
    if(!rows || rows.length===0){
      board.innerHTML = '<div class="empty">Todavía no hay datos cargados. Se van a ir sumando a medida que se anoten jugadores y goles desde el editor de cada partido.</div>';
      return;
    }
    board.innerHTML = rows.map((r,i)=>`
      <div class="board-row">
        <div class="rank-num">${medalla(i)}</div>
        <div class="player-name">${r.nombre}</div>
        <div class="player-value">${r[valueKey]}<span>${valueLabel}</span></div>
      </div>
    `).join('');
  }

  async function cargarGoleadores(){
    tabGoleadores.classList.add('active'); tabTabla.classList.remove('active');
    board.style.display='block'; tableWrap.style.display='none';
    board.innerHTML = '<div class="empty">Cargando...</div>';
    const { data, error } = await supabase.rpc('ranking_goleadores', { limite: 15 });
    if(error){ board.innerHTML = '<div class="empty">No se pudo cargar el ranking.</div>'; return; }
    renderBoard(data, 'goles_totales', 'goles');
  }

  function badgeHtml(resultado){
    const clase = resultado==='V' ? 'v' : resultado==='D' ? 'd' : 'e';
    return `<span class="fb ${clase}">${resultado}</span>`;
  }

  async function cargarTabla(){
    tabTabla.classList.add('active'); tabGoleadores.classList.remove('active');
    tableWrap.style.display='block'; board.style.display='none';
    tableWrap.innerHTML = '<div class="empty">Cargando...</div>';

    const { data, error } = await supabase.rpc('tabla_jugadores', { limite: 30 });
    if(error || !data || data.length===0){
      tableWrap.innerHTML = '<div class="empty">Todavía no hay partidos con jugadores cargados.</div>';
      return;
    }

    // Traer los últimos 5 resultados de cada jugador (una consulta por jugador)
    const conHistorial = await Promise.all(data.map(async (row) => {
      const { data: historial } = await supabase.rpc('historial_jugador', { jugador_id_param: row.jugador_id, limite: 5 });
      return { ...row, historial: historial || [] };
    }));

    tableWrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>#</th><th>Jugador</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>Goles</th><th>Últimos 5</th>
          </tr>
        </thead>
        <tbody>
          ${conHistorial.map((r,i)=>`
            <tr>
              <td>${i+1}</td>
              <td>${r.nombre}</td>
              <td>${r.partidos_jugados}</td>
              <td class="pts">${r.ganados}</td>
              <td>${r.empatados}</td>
              <td>${r.perdidos}</td>
              <td>${r.goles_totales}</td>
              <td><div class="form-badges">${r.historial.slice().reverse().map(h=>badgeHtml(h.resultado)).join('') || '—'}</div></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  tabGoleadores.addEventListener('click', cargarGoleadores);
  tabTabla.addEventListener('click', cargarTabla);
  cargarGoleadores();
</script>
</body>
</html>
