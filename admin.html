<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Tus Clips</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 24px;
    max-width: 480px;
    width: 100%;
  }
  h1 { font-size: 20px; margin-top: 0; }
  label { display:block; font-size: 12.5px; color:#94a3b8; margin: 0 0 4px; font-weight:600; }
  .row { margin-bottom: 14px; }
  .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  input[type="password"], input[type="text"], input[type="date"], input[type="time"], input[type="number"] {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 16px;
  }
  details { margin-bottom: 14px; }
  summary { cursor:pointer; font-size:13px; color:#94a3b8; margin-bottom:10px; }
  .dropzone {
    border: 2px dashed #475569;
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    color: #94a3b8;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .dropzone.drag { border-color: #22c55e; color: #22c55e; }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: #22c55e;
    color: #0f172a;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
  }
  button:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
  .progress-wrap {
    background: #0f172a;
    border-radius: 8px;
    height: 12px;
    overflow: hidden;
    margin-top: 12px;
    display: none;
  }
  .progress-bar {
    background: #22c55e;
    height: 100%;
    width: 0%;
    transition: width 0.2s;
  }
  .status { margin-top: 12px; font-size: 14px; color: #94a3b8; white-space: pre-line; }
  .hidden { display: none; }
  .partido-ok { margin-top:10px; padding:10px 12px; border-radius:8px; background:#052e1a; color:#4ade80; font-size:13.5px; display:none; }
</style>
</head>
<body>

<div class="card">
  <div id="gate">
    <h1>Acceso Admin</h1>
    <input type="password" id="pass" placeholder="Contraseña">
    <button onclick="checkPass()">Entrar</button>
  </div>

  <div id="panel" class="hidden">
    <h1>Subir video de partido</h1>

    <div class="row">
      <label>Complejo</label>
      <input type="text" id="complejo" placeholder="Ej: Valladares" list="complejosList">
      <datalist id="complejosList"><option value="Valladares"></option></datalist>
    </div>
    <div class="row">
      <label>Cancha</label>
      <input type="text" id="cancha" placeholder="Ej: Cancha 3" list="canchasList">
      <datalist id="canchasList"><option value="Cancha 1"></option><option value="Cancha 2"></option><option value="Cancha 3"></option></datalist>
    </div>
    <div class="row row-2">
      <div>
        <label>Fecha del partido</label>
        <input type="date" id="fecha">
      </div>
      <div>
        <label>Hora de inicio</label>
        <input type="time" id="horaInicio">
      </div>
    </div>

    <details>
      <summary>Datos opcionales (duración, equipos)</summary>
      <div class="row">
        <label>Duración (minutos)</label>
        <input type="number" id="duracion" placeholder="60">
      </div>
      <div class="row row-2">
        <div>
          <label>Equipo A</label>
          <input type="text" id="equipoA" placeholder="Opcional">
        </div>
        <div>
          <label>Equipo B</label>
          <input type="text" id="equipoB" placeholder="Opcional">
        </div>
      </div>
    </details>

    <div class="dropzone" id="dropzone">
      Arrastrá el video acá o tocá para elegir el archivo
      <input type="file" id="fileInput" accept="video/*" style="display:none">
    </div>

    <div id="fileName" class="status"></div>

    <button id="uploadBtn" onclick="startUpload()">Subir video</button>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status" id="statusText"></div>
  </div>
</div>

<script>
  // Cambiá esta contraseña por la que quieras usar
  const ADMIN_PASSWORD = "camaras2026";
  let adminPasswordValue = "";

  let selectedFile = null;

  function checkPass() {
    const val = document.getElementById('pass').value;
    if (val === ADMIN_PASSWORD) {
      adminPasswordValue = val;
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('panel').classList.remove('hidden');
      const hoy = new Date().toISOString().slice(0,10);
      document.getElementById('fecha').value = hoy;
    } else {
      alert('Contraseña incorrecta');
    }
  }

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');

  dropzone.addEventListener('click', () => fileInput.click());

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('drag');
  });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) {
      setFile(e.dataTransfer.files[0]);
    }
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) setFile(fileInput.files[0]);
  });

  function setFile(file) {
    selectedFile = file;
    const sizeMb = (file.size / (1024 * 1024)).toFixed(1);
    document.getElementById('fileName').textContent = `Seleccionado: ${file.name} (${sizeMb} MB)`;
  }

  async function startUpload() {
    const complejo = document.getElementById('complejo').value.trim();
    const cancha = document.getElementById('cancha').value.trim();
    const fecha = document.getElementById('fecha').value;
    const horaInicio = document.getElementById('horaInicio').value;
    const duracion = document.getElementById('duracion').value;
    const equipoA = document.getElementById('equipoA').value.trim();
    const equipoB = document.getElementById('equipoB').value.trim();

    const statusText = document.getElementById('statusText');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');

    if (!complejo || !cancha || !fecha || !horaInicio) { alert('Completá complejo, cancha, fecha y hora'); return; }
    if (!selectedFile) { alert('Elegí un video primero'); return; }

    uploadBtn.disabled = true;
    statusText.textContent = 'Buscando/creando el partido...';

    try {
      // 1. Buscar o crear el partido (complejo, cancha, fecha y hora)
      const upsertResp = await fetch('/api/upsert-partido', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          adminPassword: adminPasswordValue,
          complejo, cancha, fecha, horaInicio,
          duracionMinutos: duracion ? parseInt(duracion, 10) : null,
          equipoA: equipoA || null, equipoB: equipoB || null,
        }),
      });
      const upsertData = await upsertResp.json();
      if (!upsertResp.ok) throw new Error(upsertData.error || 'Error buscando/creando el partido');

      const { partidoId, codigoAcceso } = upsertData;
      statusText.textContent = `Partido identificado (código ${codigoAcceso}). Preparando subida...`;

      const ext = selectedFile.name.split('.').pop() || 'mp4';
      const filename = `${codigoAcceso}-${Date.now()}.${ext}`;

      // 2. Pedir URL firmada
      const presignResp = await fetch('/api/presign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename, contentType: selectedFile.type || 'video/mp4' }),
      });
      const presignData = await presignResp.json();
      if (!presignResp.ok) throw new Error(presignData.error || 'Error generando URL de subida');

      // 3. Subir directo a R2 con barra de progreso
      progressWrap.style.display = 'block';
      statusText.textContent = 'Subiendo video...';

      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', presignData.url);
        xhr.setRequestHeader('Content-Type', selectedFile.type || 'video/mp4');
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 100);
            progressBar.style.width = pct + '%';
            statusText.textContent = `Subiendo... ${pct}%`;
          }
        };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) resolve();
          else reject(new Error('Error subiendo el archivo a R2 (status ' + xhr.status + ')'));
        };
        xhr.onerror = () => reject(new Error('Error de red subiendo el archivo'));
        xhr.send(selectedFile);
      });

      // 4. Confirmar en Supabase
      statusText.textContent = 'Actualizando partido en Supabase...';
      const confirmResp = await fetch('/api/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminPassword: adminPasswordValue, partidoId, filename }),
      });
      const confirmData = await confirmResp.json();
      if (!confirmResp.ok) throw new Error(confirmData.error || 'Error actualizando Supabase');

      statusText.textContent = `✅ Listo! Video subido y vinculado a ${complejo} - ${cancha}, ${fecha} ${horaInicio} (código ${codigoAcceso}). Ya se puede buscar en la página.`;
      progressBar.style.width = '100%';
    } catch (err) {
      statusText.textContent = '❌ ' + err.message;
    } finally {
      uploadBtn.disabled = false;
    }
  }
</script>

</body>
</html>
